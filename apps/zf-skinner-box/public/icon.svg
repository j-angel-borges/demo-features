<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgSkinner" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#24123E" />
      <stop offset="60%" stop-color="#0F091F" />
      <stop offset="100%" stop-color="#05030A" />
    </radialGradient>
    <linearGradient id="leverGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="orbGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="glowSkinner" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS / padOS Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgSkinner)" />
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="#EC4899" stroke-width="4" stroke-opacity="0.25" />

  <!-- Concentric Conditioning Target Rings -->
  <circle cx="256" cy="270" r="170" stroke="#533B87" stroke-width="12" stroke-dasharray="16 12" opacity="0.6" />
  <circle cx="256" cy="270" r="120" stroke="#D6C8FA" stroke-width="8" stroke-opacity="0.5" />
  <circle cx="256" cy="270" r="70" fill="#090514" stroke="#C2F4E7" stroke-width="6" />

  <!-- Mechanical Operant Lever Arm (VR-7 Actuator) -->
  <g transform="translate(0, 0)">
    <!-- Lever Shaft -->
    <path d="M256 270 L350 130" stroke="url(#leverGlow)" stroke-width="24" stroke-linecap="round" filter="url(#glowSkinner)" />
    <!-- Lever Pivot Base -->
    <circle cx="256" cy="270" r="32" fill="url(#leverGlow)" filter="url(#glowSkinner)" />
    <circle cx="256" cy="270" r="16" fill="#FFFFFF" />
    
    <!-- Tactile Knob / Dopamine Trigger Sphere -->
    <circle cx="350" cy="130" r="38" fill="url(#orbGlow)" filter="url(#glowSkinner)" />
    <circle cx="342" cy="120" r="12" fill="#FFFFFF" opacity="0.75" />
  </g>

  <!-- Variable Reward Spark Burst -->
  <circle cx="160" cy="170" r="8" fill="#FBBF24" filter="url(#glowSkinner)" />
  <circle cx="390" cy="280" r="10" fill="#EC4899" filter="url(#glowSkinner)" />
  <circle cx="150" cy="360" r="12" fill="#C2F4E7" filter="url(#glowSkinner)" />
  <circle cx="320" cy="410" r="9" fill="#818CF8" filter="url(#glowSkinner)" />
</svg>
