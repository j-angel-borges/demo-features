<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark elegant Zentry gradient -->
    <linearGradient id="bgDarkSK" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1035"/>
      <stop offset="50%" stop-color="#0E071A"/>
      <stop offset="100%" stop-color="#05020B"/>
    </linearGradient>

    <filter id="softGlowSK" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#EC4899" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Canvas (Dark Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgDarkSK)"/>

  <!-- Minimalist Inset Border -->
  <rect x="28" y="28" width="456" height="456" rx="92" fill="none" stroke="#EC4899" stroke-width="8" stroke-opacity="0.2"/>

  <!-- Clean, bold, elegant SK Monogram in Crisp White -->
  <g filter="url(#softGlowSK)" fill="#FFFFFF">
    <!-- "S" Glyph (Clean Geometric) -->
    <path d="
      M 225 190
      L 190 160
      C 140 160 95 185 95 225
      C 95 260 125 275 170 285
      C 195 292 205 298 205 310
      C 205 322 185 330 165 330
      C 135 330 108 318 90 300
      V 348
      C 112 360 140 366 165 366
      C 215 366 258 342 258 300
      C 258 262 225 248 180 238
      C 155 232 145 226 145 215
      C 145 204 162 196 180 196
      C 202 196 220 205 235 218
      Z
    "/>

    <!-- "K" Glyph (Clean Geometric) -->
    <path d="
      M 285 160
      H 338
      V 240
      L 388 160
      H 448
      L 378 258
      L 452 352
      H 388
      L 338 276
      V 352
      H 285
      Z
    "/>
  </g>
</svg>
