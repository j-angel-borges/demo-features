<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark elegant Zentry gradient -->
    <linearGradient id="bgDarkID" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E38"/>
      <stop offset="50%" stop-color="#0B1224"/>
      <stop offset="100%" stop-color="#040813"/>
    </linearGradient>

    <filter id="softGlowID" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38BDF8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Canvas (Dark Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgDarkID)"/>

  <!-- Minimalist Inset Border -->
  <rect x="28" y="28" width="456" height="456" rx="92" fill="none" stroke="#38BDF8" stroke-width="8" stroke-opacity="0.2"/>

  <!-- Clean, bold, elegant ID Monogram in Crisp White -->
  <g filter="url(#softGlowID)" fill="#FFFFFF">
    <!-- "I" Glyph (Clean Geometric) -->
    <path d="
      M 115 160 
      H 205 
      V 208 
      H 185 
      V 304 
      H 205 
      V 352 
      H 115 
      V 304 
      H 135 
      V 208 
      H 115 
      Z
    "/>

    <!-- "D" Glyph (Harmonized Geometric) -->
    <path d="
      M 255 160 
      H 345 
      C 395 160 425 195 425 256 
      C 425 317 395 352 345 352 
      H 255 
      Z 
      M 305 210 
      V 302 
      H 342 
      C 368 302 375 285 375 256 
      C 375 227 368 210 342 210 
      Z
    "/>
  </g>
</svg>
