<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark elegant Zentry gradient -->
    <linearGradient id="bgDarkPA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1333"/>
      <stop offset="50%" stop-color="#0F0A1F"/>
      <stop offset="100%" stop-color="#05030A"/>
    </linearGradient>

    <filter id="softGlowPA" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#D6C8FA" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Canvas (Dark Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgDarkPA)"/>

  <!-- Minimalist Inset Border -->
  <rect x="28" y="28" width="456" height="456" rx="92" fill="none" stroke="#D6C8FA" stroke-width="8" stroke-opacity="0.2"/>

  <!-- Clean, bold, elegant PA Monogram in Crisp White -->
  <g filter="url(#softGlowPA)" fill="#FFFFFF">
    <!-- "P" Glyph (Clean Geometric) -->
    <path d="
      M 95 160 
      H 195 
      C 232 160 255 180 255 218 
      C 255 256 232 276 195 276 
      H 147 
      V 352 
      H 95 
      Z 
      M 147 210 
      V 226 
      H 190 
      C 202 226 210 220 210 218 
      C 210 216 202 210 190 210 
      Z
    "/>

    <!-- "A" Glyph (Clean Geometric) -->
    <path d="
      M 345 160 
      L 420 352 
      H 368 
      L 352 308 
      H 288 
      L 272 352 
      H 220 
      L 295 160 
      Z 
      M 338 266 
      L 320 212 
      L 302 266 
      Z
    "/>
  </g>
</svg>
