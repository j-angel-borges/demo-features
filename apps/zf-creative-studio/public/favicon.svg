<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark elegant Zentry gradient -->
    <linearGradient id="bgDarkCS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A112E"/>
      <stop offset="50%" stop-color="#0E0919"/>
      <stop offset="100%" stop-color="#06040B"/>
    </linearGradient>

    <filter id="softGlowCS" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#D6C8FA" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Canvas (Dark Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgDarkCS)"/>

  <!-- Minimalist Inset Border -->
  <rect x="28" y="28" width="456" height="456" rx="92" fill="none" stroke="#D6C8FA" stroke-width="8" stroke-opacity="0.2"/>

  <!-- Clean, bold, elegant CS Monogram (Creative Studio) in Crisp White / Glacial Accent -->
  <g filter="url(#softGlowCS)" fill="#FFFFFF">
    <!-- "C" Glyph (Clean Geometric) -->
    <path d="
      M 235 185
      L 200 160
      C 140 160 95 200 95 256
      C 95 312 140 352 200 352
      L 235 327
      V 282
      L 200 298
      C 170 298 147 280 147 256
      C 147 232 170 214 200 214
      L 235 230
      Z
    "/>

    <!-- "S" Glyph (Harmonized Geometric) -->
    <path d="
      M 405 190
      L 370 160
      C 320 160 275 185 275 225
      C 275 260 305 275 350 285
      C 375 292 385 298 385 310
      C 385 322 365 330 345 330
      C 315 330 288 318 270 300
      V 348
      C 292 360 320 366 345 366
      C 395 366 438 342 438 300
      C 438 262 405 248 360 238
      C 335 232 325 226 325 215
      C 325 204 342 196 360 196
      C 382 196 400 205 415 218
      Z
    "/>
  </g>
</svg>
