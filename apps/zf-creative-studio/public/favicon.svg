<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="30%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#2D1B54" />
      <stop offset="50%" stop-color="#140E2A" />
      <stop offset="100%" stop-color="#080612" />
    </radialGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="tipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS / padOS Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="#D6C8FA" stroke-width="4" stroke-opacity="0.25" />

  <!-- Dynamic Creative Brush / Wand with Glowing Tail -->
  <g transform="translate(20, -10)">
    <!-- Brush Handle / Wand Body -->
    <path d="M190 350 L272 150 C276 140 290 140 294 150 L350 350 C354 360 346 370 336 370 L204 370 C194 370 186 360 190 350 Z" 
          fill="url(#neonGlow)" filter="url(#glow)" />
    
    <!-- Magical Glowing Nib -->
    <polygon points="283,75 305,145 261,145" fill="url(#tipGrad)" filter="url(#glow)" />
    
    <!-- Central Energy Core -->
    <circle cx="283" cy="255" r="32" fill="#FFFFFF" opacity="0.9" filter="url(#glow)" />
    <circle cx="283" cy="255" r="18" fill="#C2F4E7" />
  </g>

  <!-- Sparkle Stars -->
  <path d="M110 150 Q110 180 80 180 Q110 180 110 210 Q110 180 140 180 Q110 180 110 150 Z" fill="#FDE047" filter="url(#glow)" />
  <path d="M410 120 Q410 145 385 145 Q410 145 410 170 Q410 145 435 145 Q410 145 410 120 Z" fill="#C2F4E7" filter="url(#glow)" />
  <circle cx="120" cy="380" r="12" fill="#F472B6" opacity="0.85" />
  <circle cx="400" cy="380" r="16" fill="#38BDF8" opacity="0.85" />
</svg>
